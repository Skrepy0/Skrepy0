name: 更新 Waka 数据并重新部署
on:
  schedule:
    - cron: '30 18 * * *' # 每天 UTC 18:30（北京时间凌晨 2:30）触发
  workflow_dispatch:      # 允许手动触发

permissions:
  contents: write
 
jobs:
  update-readme:
    name: Update WakaTime Stats
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 使用新一代的 athul/waka-readme Action
      - uses: athul/waka-readme@master
        timeout-minutes: 10
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          
          # ---------- 新版核心配置 ----------
          SHOW_TITLE: true          # 显示 "Weekly Development Breakdown" 标题
          TIME_RANGE: last_7_days   # 统计时间范围 (可选 last_7_days 或 all_time)
          SHOW_TIME: true           # 显示具体的编码时长 (如 12 hrs 30 mins)
          SHOW_TOTAL: true          # 显示总时长
          LANG_COUNT: 8             # 显示前 8 种语言
          BLOCKS: "█▓▒░"            # 进度条图形样式
          
          
